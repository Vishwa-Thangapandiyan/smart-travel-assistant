     Flutter, this file just shows the exact layout and values. See DESIGN.md. -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">

body{margin:0}
a{color:#b35a07}a:hover{color:#1c140d}

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f5ecdd; color: #1c140d; font-family: 'Manrope', system-ui, sans-serif">

<div style="padding: 24px 20px 0; display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.025em">Budget</h1>
<div role="group" aria-label="Show spending for" style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: #fffaf2; border: 1px solid #e6d8c2">
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #1c140d; color: #f5ecdd; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600">Trip</button>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: transparent; color: rgba(28,20,13,0.55); font-family: 'JetBrains Mono', monospace; font-size: 12px">Today</button>
</div>
</div>

<div style="padding: 26px 20px 0">
<div style="display: flex; align-items: flex-start; gap: 4px">
<span style="font-size: 30px; font-weight: 500; margin-top: 10px; color: rgba(28,20,13,0.55)">₹</span>
<span style="font-size: 104px; font-weight: 600; letter-spacing: -0.06em; line-height: 0.82; font-variant-numeric: tabular-nums">3,940</span>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(28,20,13,0.6)"><span>left of ₹15,000</span><span>₹11,060 spent</span></div>
<div role="img" aria-label="74 percent spent" style="margin-top: 10px; height: 6px; border-radius: 999px; background: #e6d8c2; overflow: hidden"><div style="width: 74%; height: 100%; background: #d9780f"></div></div>
</div>

<div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px; border-radius: 18px; background: #fbe3dd; border: 1px solid #e8a79c">
<div><div style="font-size: 16px; font-weight: 600">Transport</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9c2a21; margin-top: 2px">93% · two days to go</div></div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: -0.03em; color: #9c2a21">₹210</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px; border-radius: 18px; background: #fffaf2; border: 1px solid #ecdfca">
<div><div style="font-size: 16px">Food</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(28,20,13,0.55); margin-top: 2px">3,120 of 4,000</div></div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: -0.03em">₹880</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px; border-radius: 18px; background: #fffaf2; border: 1px solid #ecdfca">
<div><div style="font-size: 16px">Stay</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(28,20,13,0.55); margin-top: 2px">4,500 of 6,000</div></div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: -0.03em">₹1,500</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px; border-radius: 18px; background: #fffaf2; border: 1px solid #ecdfca">
<div><div style="font-size: 16px">Activities</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(28,20,13,0.55); margin-top: 2px">650 of 2,000</div></div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: -0.03em">₹1,350</div>
</div>
</div>

<div style="padding: 14px 20px 0; font-size: 12px; line-height: 1.5; color: rgba(28,20,13,0.55)">Stops in your plan don't carry prices — only what you log counts here.</div>

<button type="button" style="position: absolute; left: 20px; right: 20px; bottom: 102px; min-height: 54px; border-radius: 999px; border: none; background: #f39a2b; color: #1f1104; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log an expense</button>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 68px; box-sizing: border-box; padding: 0 8px; border-radius: 999px; background: #fffaf2; border: 1px solid #e6d8c2; display: flex; align-items: center; justify-content: space-between">
<a href="#" aria-label="Days" style="width: 48px; height: 48px; border-radius: 50%; color: rgba(28,20,13,0.55); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v4a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3"/></svg></a>
<a href="#" aria-label="Map" style="width: 48px; height: 48px; border-radius: 50%; color: rgba(28,20,13,0.55); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></a>
<a href="#" aria-current="page" aria-label="Budget" style="width: 48px; height: 48px; border-radius: 50%; background: #1c140d; color: #f5ecdd; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg></a>
<a href="#" aria-label="Explore" style="width: 48px; height: 48px; border-radius: 50%; color: rgba(28,20,13,0.55); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/></svg></a>
<a href="#" aria-label="Emergency help" style="height: 48px; padding: 0 18px; border-radius: 999px; background: #b83228; color: #ffffff; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; text-decoration: none">SOS</a>

</div>
