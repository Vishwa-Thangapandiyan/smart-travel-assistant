<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Meridian — Day, daylight</title>
<!-- Exported from the Meridian design canvas. Reference only: the app is
     Flutter, this file just shows the exact layout and values. See DESIGN.md. -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#b35a07}a:hover{color:#1c140d}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f5ecdd; color: #1c140d; font-family: 'Manrope', system-ui, sans-serif">

<div style="padding: 14px 20px 0; display: flex; justify-content: space-between; align-items: center">
<a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; color: #1c140d; text-decoration: none; font-size: 15px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Bangalore</a>
<span style="padding: 7px 12px; border-radius: 999px; background: rgba(44,118,71,0.12); color: #1f5a35; font-family: 'JetBrains Mono', monospace; font-size: 11px">● Saved offline</span>
</div>

<div role="group" aria-label="Choose a day" style="margin: 8px 20px 0; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #fffaf2; border: 1px solid #e6d8c2">
<button type="button" style="flex: 1; height: 40px; border-radius: 999px; border: none; background: transparent; color: rgba(28,20,13,0.55); font-family: 'JetBrains Mono', monospace; font-size: 12px">Fri 20</button>
<button type="button" aria-pressed="true" style="flex: 1; height: 40px; border-radius: 999px; border: none; background: #1c140d; color: #f5ecdd; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600">Sat 21</button>
<button type="button" style="flex: 1; height: 40px; border-radius: 999px; border: none; background: transparent; color: rgba(28,20,13,0.55); font-family: 'JetBrains Mono', monospace; font-size: 12px">Sun 22</button>
<button type="button" style="flex: 1; height: 40px; border-radius: 999px; border: none; background: transparent; color: rgba(28,20,13,0.55); font-family: 'JetBrains Mono', monospace; font-size: 12px">Mon 23</button>
</div>

<div style="padding: 22px 20px 0; display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 500; letter-spacing: -0.02em">Saturday, 21 Nov</h1>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(28,20,13,0.55)">5 stops · 14.7 km</span>
</div>

<div style="padding: 16px 20px 0; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 12px">

<div style="display: flex; flex-direction: column; align-items: center"><div style="width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #d9780f"></div><div style="flex: 1; width: 2px; background: #d9780f"></div></div>
<div style="padding-bottom: 16px; font-size: 13px; color: rgba(28,20,13,0.55)">Done · MTR 08:00 · Lalbagh 09:30</div>

<div style="display: flex; flex-direction: column; align-items: center"><div style="width: 2px; height: 22px; background: #d9780f"></div><div style="width: 14px; height: 14px; border-radius: 50%; background: #d9780f; box-shadow: 0 0 0 6px rgba(217,120,15,0.18)"></div><div style="flex: 1; width: 2px; background: #e0d0b8"></div></div>
<div style="margin-bottom: 18px; padding: 18px; border-radius: 24px; background: #1c140d; color: #f5ecdd">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="font-size: 64px; font-weight: 600; letter-spacing: -0.055em; line-height: 0.82; font-variant-numeric: tabular-nums">12:30</div>
<div style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #f8b968; line-height: 1.5">IN 40 MIN<br>7.1 KM</div>
</div>
<div style="font-size: 20px; font-weight: 600; margin-top: 14px; letter-spacing: -0.01em">Bangalore Palace</div>
<div style="font-size: 14px; color: rgba(245,236,221,0.66); margin-top: 2px">Audio tour at the gate</div>
<div style="display: flex; gap: 8px; margin-top: 14px">
<a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 999px; background: #f39a2b; color: #1f1104; font-size: 15px; font-weight: 600; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>Route there</a>
<button type="button" aria-label="Edit stop" style="width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(245,236,221,0.25); background: transparent; color: #f5ecdd; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center"><div style="width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; border: 2px solid rgba(28,20,13,0.4); box-sizing: border-box"></div><div style="flex: 1; width: 2px; background: #e0d0b8"></div></div>
<div style="padding-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline"><div><div style="font-size: 17px; font-weight: 500">Cubbon Park</div><div style="font-size: 13px; color: rgba(28,20,13,0.6); margin-top: 2px">Walk to the State Library</div></div><div style="font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: -0.03em">16:00</div></div>

<div style="display: flex; flex-direction: column; align-items: center"><div style="width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; border: 2px solid rgba(28,20,13,0.4); box-sizing: border-box"></div></div>
<div style="padding-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline"><div><div style="font-size: 17px; font-weight: 500">Church Street</div><div style="font-size: 13px; color: rgba(28,20,13,0.6); margin-top: 2px">Dinner, bookshops</div></div><div style="font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: -0.03em">19:00</div></div>

<div></div>
<div style="display: flex; gap: 8px">
<button type="button" style="display: flex; align-items: center; gap: 6px; padding: 0 16px; min-height: 44px; border-radius: 999px; border: 1px dashed rgba(28,20,13,0.35); background: transparent; color: #1c140d; font-family: inherit; font-size: 14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a stop</button>
<button type="button" style="padding: 0 10px; min-height: 44px; border: none; background: transparent; color: #b35a07; font-family: inherit; font-size: 14px; font-weight: 600">From suggestions</button>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 68px; box-sizing: border-box; padding: 0 8px; border-radius: 999px; background: #fffaf2; border: 1px solid #e6d8c2; display: flex; align-items: center; justify-content: space-between">
<a href="#" aria-current="page" aria-label="Days" style="width: 48px; height: 48px; border-radius: 50%; background: #1c140d; color: #f5ecdd; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v4a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3"/></svg></a>
<a href="#" aria-label="Map" style="width: 48px; height: 48px; border-radius: 50%; color: rgba(28,20,13,0.55); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></a>
<a href="#" aria-label="Budget" style="width: 48px; height: 48px; border-radius: 50%; color: rgba(28,20,13,0.55); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg></a>
<a href="#" aria-label="Explore" style="width: 48px; height: 48px; border-radius: 50%; color: rgba(28,20,13,0.55); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/></svg></a>
<a href="#" aria-label="Emergency help" style="height: 48px; padding: 0 18px; border-radius: 999px; background: #b83228; color: #ffffff; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; text-decoration: none">SOS</a>
</nav>
</div>
</body>
</html>
