name: smart_travel_assistant
description: Smart Travel Planning Assistant and Budget Management System
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

# Dependencies — this list is fixed. Do not add a package without telling
# the group first; a new dependency changes what every branch needs to run.
dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.5.0 # auth + database client
  flutter_map: ^8.3.1 # map display, reads OpenStreetMap tiles
  latlong2: ^0.10.1 # coordinate type flutter_map expects
  geolocator: ^14.0.3 # GPS position from the OS
  hive: ^2.2.3 # offline local storage
  hive_flutter: ^1.1.0 # Flutter bindings for Hive (init, box lifecycle)
  provider: ^6.1.2 # state management
  url_launcher: ^6.3.0 # tel: links for emergency calling
  http: ^1.2.1 # OSRM / Overpass HTTP calls
  intl: ^0.20.3 # date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Logo and the brand intro (made from docs/logo_assets).
  assets:
    - assets/brand/

  # Bundled font files (SIL Open Font License, see assets/fonts/OFL-*.txt),
  # not the google_fonts package — that would be a new dependency, and
  # bundled files also work offline. See DESIGN.md §4.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
